# [START cloudbuild_quickstart_build]
steps:
  # Step 1: Generate .env in /workspace
    - name: 'ubuntu'
      entrypoint: 'bash'
      args:
        - '-c'
        - |
          cat <<EOF > /workspace/.env
          VITE_APP_BACKEND_HOST=$$VITE_APP_BACKEND_HOST
          VITE_APP_AWS_BUCKET_NAME=$$VITE_APP_AWS_BUCKET_NAME
          VITE_APP_AWS_ACCESS_KEY=$$VITE_APP_AWS_ACCESS_KEY
          VITE_APP_AWS_SECRET_KEY=$$VITE_APP_AWS_SECRET_KEY
          VITE_APP_AWS_REGION=$$VITE_APP_AWS_REGION
          EOF
      secretEnv: # Secrets are masked in logs
        - 'VITE_APP_BACKEND_HOST'
        - 'VITE_APP_AWS_ACCESS_KEY'
        - 'VITE_APP_AWS_SECRET_KEY'
        - 'VITE_APP_AWS_REGION'
        - 'VITE_APP_AWS_BUCKET_NAME'
    - name: 'ubuntu'
      args: [ 'ls', '-la', '/workspace' ]

    - name: 'ubuntu'
      entrypoint: 'bash'
      args:
        - '-c'
        - |
          cat /workspace/.env  # Print .env contents to logs

    # -------------------- Build docker image from dockerfile in the root of the repo (accesses /workspace/.env)---------------------------------
    - name: 'gcr.io/cloud-builders/docker'
      args:
          - build
          - '--no-cache'
          - '-t'
          - '$LOCATION-docker.pkg.dev/$PROJECT_ID/nudgenest-fe-service/nudgenest-fe-service:$COMMIT_SHA'
          - .
          - '-f'
          - Dockerfile
      dir: '/workspace'  # Ensure Dockerfile is in /workspace
      id: 'build'
    # -------------------- Push to google repo ---------------------------------
    - name: 'gcr.io/cloud-builders/docker'
      args:
          - push
          - '$LOCATION-docker.pkg.dev/$PROJECT_ID/nudgenest-fe-service/nudgenest-fe-service:$COMMIT_SHA'
      id: 'push'

    # -------------------- Deploy ---------------------------------
    - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
      args:
          - run
          - services
          - update
          - nudgenest-review-ui
          - '--update-env-vars=VITE_APP_AWS_REGION=$$VITE_APP_AWS_REGION,VITE_APP_AWS_BUCKET_NAME=$$VITE_APP_AWS_BUCKET_NAME,VITE_APP_AWS_ACCESS_KEY=$$VITE_APP_AWS_ACCESS_KEY,VITE_APP_AWS_SECRET_KEY=$$VITE_APP_AWS_SECRET_KEY,VITE_APP_BACKEND_HOST=$$VITE_APP_BACKEND_HOST'
          - '--platform=managed'
          - '--image=$LOCATION-docker.pkg.dev/$PROJECT_ID/nudgenest-fe-service/nudgenest-fe-service:$COMMIT_SHA'
          - '--labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID,$_LABELS'
          - '--region=$_DEPLOY_REGION'
          - '--quiet'
          - '--update-secrets'
          - 'VITE_APP_BACKEND_HOST=projects/1094805904049/secrets/VITE_APP_BACKEND_HOST:latest'
          - '--update-secrets'
          - 'VITE_APP_AWS_ACCESS_KEY=projects/1094805904049/secrets/VITE_APP_AWS_ACCESS_KEY:latest'
          - '--update-secrets'
          - 'VITE_APP_AWS_SECRET_KEY=projects/1094805904049/secrets/VITE_APP_AWS_SECRET_KEY:latest'
          - '--update-secrets'
          - 'VITE_APP_AWS_REGION=projects/1094805904049/secrets/VITE_APP_AWS_REGION:latest'
          - '--update-secrets'
          - 'VITE_APP_AWS_BUCKET_NAME=projects/1094805904049/secrets/VITE_APP_AWS_BUCKET_NAME:latest'
      id: Deploy
      secretEnv:
          - 'VITE_APP_BACKEND_HOST'
          - 'VITE_APP_AWS_ACCESS_KEY'
          - 'VITE_APP_AWS_SECRET_KEY'
          - 'VITE_APP_AWS_REGION'
          - 'VITE_APP_AWS_BUCKET_NAME'
      entrypoint: gcloud
      waitFor: ['push']
images:
    - '$LOCATION-docker.pkg.dev/$PROJECT_ID/nudgenest-fe-service/nudgenest-fe-service:$COMMIT_SHA'
options:
    logging: CLOUD_LOGGING_ONLY
    substitutionOption: ALLOW_LOOSE
substitutions:
    _DEPLOY_REGION: europe-west1
    _GCR_HOSTNAME: eu.gcr.io
    _PLATFORM: managed
tags:
    - gcp-cloud-build-deploy-cloud-run
    - gcp-cloud-build-deploy-cloud-run-managed
    - nudgenest-fe-service

availableSecrets:
    secretManager:
        - versionName: 'projects/$PROJECT_ID/secrets/VITE_APP_BACKEND_HOST/versions/2'
          env: 'VITE_APP_BACKEND_HOST'
        - versionName: 'projects/$PROJECT_ID/secrets/VITE_APP_AWS_ACCESS_KEY/versions/1'
          env: 'VITE_APP_AWS_ACCESS_KEY'
        - versionName: 'projects/$PROJECT_ID/secrets/VITE_APP_AWS_SECRET_KEY/versions/1'
          env: 'VITE_APP_AWS_SECRET_KEY'
        - versionName: 'projects/$PROJECT_ID/secrets/VITE_APP_AWS_REGION/versions/1'
          env: 'VITE_APP_AWS_REGION'
        - versionName: 'projects/$PROJECT_ID/secrets/VITE_APP_AWS_BUCKET_NAME/versions/1'
          env: 'VITE_APP_AWS_BUCKET_NAME'
# [END cloudbuild_quickstart_build]
